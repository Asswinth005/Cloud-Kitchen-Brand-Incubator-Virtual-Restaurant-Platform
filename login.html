<!DOCTYPE html>
<html lang="en" dir="ltr" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, height=device-height, viewport-fit=cover">
    <title>Sign In · CloudKitchen — Virtual Restaurant Platform</title>

    <!-- Favicon — CloudKitchen chef toque & cloud mark -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100' fill='none'%3E%3Crect x='6' y='6' width='88' height='88' rx='28' fill='%23D96C3A'/%3E%3Cpath d='M34 50 C30 50 28 44 32 40 C34 36 40 35 43 38 C46 32 54 30 59 34 C63 31 71 33 73 38 C77 38 79 43 77 47 C79 50 77 54 73 54 H34 Z' fill='%23FFFFFF'/%3E%3Cpath d='M35 56 H65 V63 C65 65.2 63.2 67 61 67 H39 C36.8 67 35 65.2 35 63 V56 Z' fill='%23FFFFFF'/%3E%3Cpath d='M50 44 C46 51 46 56 50 61 C54 56 54 51 50 44 Z' fill='%23BF5A2E'/%3E%3C/svg%3E" />
    <link rel="shortcut icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100' fill='none'%3E%3Crect x='6' y='6' width='88' height='88' rx='28' fill='%23D96C3A'/%3E%3Cpath d='M34 50 C30 50 28 44 32 40 C34 36 40 35 43 38 C46 32 54 30 59 34 C63 31 71 33 73 38 C77 38 79 43 77 47 C79 50 77 54 73 54 H34 Z' fill='%23FFFFFF'/%3E%3Cpath d='M35 56 H65 V63 C65 65.2 63.2 67 61 67 H39 C36.8 67 35 65.2 35 63 V56 Z' fill='%23FFFFFF'/%3E%3Cpath d='M50 44 C46 51 46 56 50 61 C54 56 54 51 50 44 Z' fill='%23BF5A2E'/%3E%3C/svg%3E" />

    <!-- Tailwind CSS -->
    <script src="tailwind.js"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#D96C3A',
                        primaryLight: '#E88A5E',
                        primaryDark: '#BF5A2E',
                        accent: '#F5A623',
                        accentDark: '#D48A1E',
                        cream: '#FCF8F5',
                        darkBg: '#1A1614',
                        darkCard: '#2A2420',
                        textDark: '#1E1A17',
                        textLight: '#EDE6E0',
                        gold: '#D4A373',
                    },
                    fontFamily: {
                        'display': ['"Playfair Display"', 'serif'],
                        'body': ['"Inter"', 'system-ui', 'sans-serif'],
                    },
                    backgroundImage: {
                        'warm-pattern': 'radial-gradient(circle at 30% 40%, rgba(217, 108, 58, 0.08) 0%, transparent 70%)',
                    },
                    animation: {
                        'fade-in': 'fadeIn 0.3s ease-out',
                        'float': 'float 6s ease-in-out infinite',
                        'spin-slow': 'spinSlow 10s linear infinite',
                    },
                    keyframes: {
                        fadeIn: { '0%': { opacity: '0', transform: 'translateY(10px)' }, '100%': { opacity: '1', transform: 'translateY(0)' } },
                        float: { '0%,100%': { transform: 'translateY(0)' }, '50%': { transform: 'translateY(-6px)' } },
                        spinSlow: { '0%': { transform: 'rotate(0deg)' }, '100%': { transform: 'rotate(360deg)' } },
                    }
                }
            }
        }
    </script>

    <!-- Google Fonts: Playfair Display + Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,800;1,400&family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <style>
        /* ----- NO SCROLL — fit exactly one screen ----- */
        html,
        body {
            height: 100%;
            overflow: hidden;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #FCF8F5;
            color: #1E1A17;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            font-family: 'Inter', system-ui, sans-serif;
        }

        .dark body {
            background-color: #1A1614;
            color: #EDE6E0;
        }

        /* Dark mode fallback text contrast overrides */
        .dark .text-\[\#1E1A17\] {
            color: #EDE6E0;
        }
        .dark input,
        .dark select,
        .dark textarea {
            color: #FFFFFF !important;
        }

        /* toggle buttons — positioned top-right */
        .theme-toggle-wrapper {
            position: fixed;
            top: 12px;
            right: 12px;
            z-index: 1000;
            display: flex;
            gap: 6px;
        }

        .toggle-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: rgba(217, 108, 58, 0.15);
            color: #D96C3A;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
            font-size: 1rem;
            font-weight: bold;
        }

        .dark .toggle-btn {
            background: rgba(217, 108, 58, 0.2);
            color: #E88A5E;
        }

        .toggle-btn:hover {
            transform: scale(1.1);
            background: #D96C3A;
            color: #FCF8F5;
        }

        .dark .toggle-btn:hover {
            background: #D96C3A;
            color: #FCF8F5;
        }

        /* LOGIN CARD */
        .login-card {
            background: white;
            border-radius: 36px;
            padding: 2.2rem 2rem 2rem;
            box-shadow: 0 20px 45px rgba(217, 108, 58, 0.12);
            border: 1px solid rgba(217, 108, 58, 0.15);
            width: 100%;
            max-width: 460px;
            margin: 0 auto;
        }

        .dark .login-card {
            background: #2A2420;
            border-color: rgba(217, 108, 58, 0.3);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
        }

        /* input styling */
        .login-input {
            width: 100%;
            padding: 0.85rem 1.2rem 0.85rem 3rem;
            border-radius: 50px;
            border: 1.5px solid rgba(217, 108, 58, 0.15);
            background: white;
            font-size: 0.95rem;
            transition: all 0.2s;
            color: #1E1A17;
            font-family: 'Inter', sans-serif;
        }

        .dark .login-input {
            background: #1A1614;
            border-color: rgba(217, 108, 58, 0.3);
            color: #EDE6E0;
        }

        .login-input:focus {
            outline: none;
            border-color: #D96C3A;
            box-shadow: 0 0 0 3px rgba(217, 108, 58, 0.2);
        }

        .dark .login-input:focus {
            border-color: #E88A5E;
            box-shadow: 0 0 0 3px rgba(217, 108, 58, 0.25);
        }

        /* password wrapper */
        .password-wrapper {
            position: relative;
            width: 100%;
        }

        .password-wrapper .login-input {
            padding-right: 3rem;
        }

        .toggle-password {
            position: absolute;
            right: 1rem;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #D96C3A;
            font-size: 1rem;
            transition: color 0.2s;
            background: transparent;
            border: none;
            z-index: 5;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .dark .toggle-password {
            color: #E88A5E;
        }

        .toggle-password:hover {
            color: #BF5A2E;
        }

        [dir="rtl"] .toggle-password {
            right: auto;
            left: 1rem;
        }

        [dir="rtl"] .password-wrapper .login-input {
            padding-right: 1.2rem;
            padding-left: 3rem;
        }

        [dir="rtl"] .input-icon {
            left: auto;
            right: 1.1rem;
        }

        /* primary button */
        .scoop-btn {
            background: #D96C3A;
            color: #FCF8F5;
            font-weight: 700;
            padding: 0.8rem 1.8rem;
            border-radius: 50px;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            font-size: 1rem;
            border: none;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
        }

        .scoop-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(217, 108, 58, 0.35);
            background: #BF5A2E;
        }

        /* social login buttons */
        .social-btn-row {
            display: flex;
            gap: 1rem;
            width: 100%;
        }

        .social-btn {
            flex: 1;
            padding: 0.8rem 0.5rem;
            border-radius: 50px;
            border: 1.5px solid rgba(217, 108, 58, 0.15);
            background: white;
            color: #1E1A17;
            font-weight: 600;
            font-size: 0.9rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: all 0.25s ease;
            gap: 0.5rem;
            white-space: nowrap;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
        }

        .dark .social-btn {
            background: #1A1614;
            border-color: rgba(217, 108, 58, 0.3);
            color: #EDE6E0;
        }

        .social-btn:hover {
            background: #FCF8F5;
            border-color: #D96C3A;
            transform: translateY(-2px);
        }

        .dark .social-btn:hover {
            background: #2A2420;
            border-color: #E88A5E;
        }

        .social-btn i {
            font-size: 1.1rem;
            color: #D96C3A;
        }

        /* logo container */
        .logo-center {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-bottom: 1.5rem;
        }

        .brand-logo {
            background: #D96C3A;
            width: 36px;
            height: 36px;
            border-radius: 11px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 0;
            box-shadow: 0 4px 10px rgba(217, 108, 58, 0.25);
            transition: all 0.3s ease;
            overflow: hidden;
        }

        @media (min-width: 768px) {
            .brand-logo {
                width: 40px;
                height: 40px;
            }
        }

        .welcome-title {
            font-family: 'Playfair Display', serif;
            font-size: 1.75rem;
            font-weight: 700;
            color: #1E1A17;
            margin-top: 1.75rem;
            margin-bottom: 0.25rem;
            text-align: center;
            line-height: 1.2;
        }

        .dark .welcome-title {
            color: #EDE6E0;
        }

        .welcome-subtitle {
            font-size: 0.9rem;
            color: #1E1A17;
            text-align: center;
            margin-bottom: 0.5rem;
            font-weight: 400;
        }

        .dark .welcome-subtitle {
            color: #EDE6E0;
        }

        /* RTL adjustments */
        [dir="rtl"] .login-input {
            padding: 0.85rem 3rem 0.85rem 1.2rem;
        }

        [dir="rtl"] .input-icon {
            left: auto;
            right: 1.1rem;
        }

        [dir="rtl"] .fa-arrow-right {
            transform: scaleX(-1);
        }

        [dir="rtl"] .theme-toggle-wrapper {
            right: auto;
            left: 20px;
        }

        /* Fix for short screens like Nest Hub (1024x600) */
        @media (max-height: 650px) {
            .login-card {
                padding: 0.8rem 1.5rem;
                transform: scale(0.95);
                transform-origin: center;
            }

            .logo-center {
                margin-bottom: 0.5rem;
            }

            .welcome-title {
                font-size: 1.3rem;
                margin-top: 0;
            }

            .welcome-subtitle {
                font-size: 0.8rem;
                margin-bottom: 0.5rem;
            }

            .login-input {
                padding: 0.6rem 0.8rem 0.6rem 2.5rem;
                font-size: 0.85rem;
            }

            .scoop-btn {
                padding: 0.6rem 1rem;
                font-size: 0.9rem;
                margin-top: 0.25rem;
            }

            .theme-toggle-wrapper {
                top: 8px;
                right: 8px;
            }

            .toggle-btn {
                width: 32px;
                height: 32px;
                font-size: 0.8rem;
            }
        }

        /* responsive */
        @media (max-width: 380px) {
            .login-card {
                padding: 1.5rem 1.2rem;
                border-radius: 24px;
            }

            .logo-center {
                margin-bottom: 1rem;
            }

            .welcome-title {
                font-size: 1.3rem;
            }

            .login-input {
                padding: 0.7rem 1rem 0.7rem 2.8rem;
                font-size: 0.85rem;
            }

            .scoop-btn {
                padding: 0.7rem 1.5rem;
                font-size: 0.95rem;
            }
        }

        @media (max-width: 480px) {
            .theme-toggle-wrapper {
                top: 12px;
                right: 12px;
            }

            [dir="rtl"] .theme-toggle-wrapper {
                left: 12px;
            }
        }

        .hidden {
            display: none;
        }

        .container-tight {
            max-width: 480px;
            width: 100%;
            padding: 0 1.5rem;
        }

        .text-primary {
            color: #D96C3A;
        }

        .hover\:text-primary-dark:hover {
            color: #BF5A2E;
        }

        a {
            transition: all 0.2s ease;
        }

        /* CloudKitchen logo SVG inside brand-logo */
        .brand-logo svg {
            width: 100%;
            height: 100%;
            padding: 5px;
        }

        /* checkbox styling */
        .custom-checkbox {
            accent-color: #D96C3A;
        }
    </style>
</head>

<body class="bg-cream dark:bg-[#1A1614] warm-pattern">

    <!-- ===== THEME TOGGLES - TOP-RIGHT ===== -->
    <div class="theme-toggle-wrapper">
        <button id="theme-toggle" class="toggle-btn" title="Dark / Light">
            <i class="fas fa-moon dark:hidden"></i>
            <i class="fas fa-sun hidden dark:inline"></i>
        </button>
        <button id="rtl-toggle" class="toggle-btn" title="RTL / LTR">
            ⇄
        </button>
    </div>

    <!-- ===== LOGIN CARD ===== -->
    <div class="container-tight">
        <div class="login-card animate-fade-in">

            <!-- ===== LOGO - CENTERED ===== -->
            <div class="logo-center">
                <a href="index.html" class="flex items-center gap-2 md:gap-3 group shrink-0">
                    <svg class="w-10 h-10 group-hover:scale-105 transition-transform duration-300 shrink-0 shadow-sm rounded-[14px]" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <rect x="6" y="6" width="88" height="88" rx="28" fill="#D96C3A"/>
                        <path d="M34 50 C30 50 28 44 32 40 C34 36 40 35 43 38 C46 32 54 30 59 34 C63 31 71 33 73 38 C77 38 79 43 77 47 C79 50 77 54 73 54 H34 Z" fill="#FFFFFF"/>
                        <path d="M35 56 H65 V63 C65 65.2 63.2 67 61 67 H39 C36.8 67 35 65.2 35 63 V56 Z" fill="#FFFFFF"/>
                        <path d="M50 44 C46 51 46 56 50 61 C54 56 54 51 50 44 Z" fill="#BF5A2E"/>
                    </svg>
                    <div>
                        <span class="text-xl md:text-2xl font-display font-bold tracking-tight text-[#1E1A17] dark:text-cream">
                            CLOUD<span class="text-primary">KITCHEN</span>
                        </span>
                    </div>
                </a>

                <h1 class="welcome-title">Welcome Back</h1>
                <p class="welcome-subtitle">Sign in to manage your virtual restaurant brands &amp; kitchen operations</p>
            </div>

            <!-- ===== LOGIN FORM ===== -->
            <form id="loginForm" class="space-y-5" action="#" method="GET">

                <!-- email field -->
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-primary input-icon">
                        <i class="fas fa-envelope w-5 text-sm"></i>
                    </span>
                    <input type="email" name="email" id="login-email" placeholder="Email address" required
                        class="login-input text-sm md:text-base">
                </div>

                <!-- password field with eye icon -->
                <div class="password-wrapper">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-primary input-icon">
                        <i class="fas fa-lock w-5 text-sm"></i>
                    </span>
                    <input type="password" id="login-password" name="password" placeholder="Password" required
                        class="login-input text-sm md:text-base">
                    <button type="button" class="toggle-password" data-target="login-password"
                        aria-label="Show password">
                        <i class="far fa-eye-slash"></i>
                    </button>
                </div>

                <!-- remember + forgot -->
                <div class="flex items-center justify-between text-xs md:text-sm">
                    <label class="flex items-center space-x-2 rtl:space-x-reverse cursor-pointer text-[#1E1A17] dark:text-cream">
                        <input type="checkbox" class="rounded border-gray-300 dark:border-gray-600 text-primary focus:ring-primary/30 dark:bg-gray-700 custom-checkbox" checked>
                        <span class="ml-1 rtl:mr-1">Remember me</span>
                    </label>
                    <a href="#" id="forgotPasswordLink"
                        class="text-[#1E1A17] dark:text-cream hover:text-primary font-semibold transition hover:underline">
                        Forgot password?
                    </a>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="scoop-btn mt-3">
                    Sign In <i class="fas fa-sign-in-alt ml-2"></i>
                </button>

                <!-- divider -->
                <div class="relative my-4">
                    <div class="absolute inset-0 flex items-center">
                        <div class="w-full border-t border-cream dark:border-gray-700"></div>
                    </div>
                    <div class="relative justify-center flex text-xs">
                        <span class="bg-white dark:bg-[#2A2420] px-4 py-0.5 text-[#1E1A17] dark:text-cream rounded-full font-semibold">
                            or continue with
                        </span>
                    </div>
                </div>

            </form>

            <!-- ===== SOCIAL LOGIN BUTTONS ===== -->
            <div class="mt-6">
                <div class="grid grid-cols-2 gap-3">
                    <button class="social-btn group w-full flex items-center justify-center gap-2 py-3 px-2 text-sm"
                        onclick="socialLogin('google')">
                        <i class="fab fa-google text-base"></i>
                        <span>Google</span>
                    </button>
                    <button class="social-btn group w-full flex items-center justify-center gap-2 py-3 px-2 text-sm"
                        onclick="socialLogin('apple')">
                        <i class="fab fa-apple text-base"></i>
                        <span>Apple</span>
                    </button>
                </div>
            </div>

            <!-- ===== "NOT A MEMBER? SIGN UP" LINK ===== -->
            <div class="text-center mt-6 pt-4 border-t border-dashed border-cream dark:border-gray-700/40">
                <p class="text-sm md:text-base font-semibold text-[#1E1A17] dark:text-cream">
                    New to CloudKitchen?
                    <a href="signup.html" class="text-primary dark:text-primary hover:text-primary-dark font-bold transition ml-1 rtl:mr-1 hover:underline">Sign Up</a>
                </p>
            </div>
        </div>
    </div>

    <!-- ===== SCRIPTS ===== -->

<script>
  document.addEventListener('DOMContentLoaded', () => {
    // 1. Theme Toggle
    const themeBtns = document.querySelectorAll('#theme-toggle, #mobile-theme-toggle');
    themeBtns.forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.preventDefault();
        document.documentElement.classList.toggle('dark');
        localStorage.setItem('theme', document.documentElement.classList.contains('dark') ? 'dark' : 'light');
      });
    });
    if (localStorage.getItem('theme') === 'dark') {
      document.documentElement.classList.add('dark');
    }

    // 2. RTL Toggle
    function setRTL(isRTL) {
      const html = document.documentElement;
      if (isRTL === 'rtl' || isRTL === true) {
        html.setAttribute('dir', 'rtl');
        localStorage.setItem('dir', 'rtl');
      } else {
        html.setAttribute('dir', 'ltr');
        localStorage.setItem('dir', 'ltr');
      }
    }
    if (localStorage.getItem('dir') === 'rtl') setRTL(true);

    const rtlBtn = document.getElementById('rtl-toggle');
    if (rtlBtn) {
      rtlBtn.addEventListener('click', (e) => {
        e.preventDefault();
        const currentDir = document.documentElement.getAttribute('dir');
        setRTL(currentDir === 'rtl' ? 'ltr' : 'rtl');
      });
    }

    const mobileRtlBtn = document.getElementById('mobile-rtl-toggle');
    if (mobileRtlBtn) {
      mobileRtlBtn.addEventListener('click', (e) => {
        e.preventDefault();
        const currentDir = document.documentElement.getAttribute('dir');
        setRTL(currentDir === 'rtl' ? 'ltr' : 'rtl');
      });
    }

    // 3. Mobile Menu Toggle
    const mobileToggle = document.getElementById('mobile-toggle');
    const mobileMenu = document.getElementById('mobile-menu');
    if (mobileToggle && mobileMenu) {
      mobileToggle.addEventListener('click', () => {
        mobileMenu.classList.toggle('open');
      });
    }

    // 4. Dynamic Active Link Highlighting
    (function highlightActiveLinks() {
      let currentPath = window.location.pathname.split('/').pop() || 'index.html';
      if (!currentPath || currentPath === '/') currentPath = 'index.html';

      document.querySelectorAll('.nav-link, .dropdown-item, .mobile-menu-studio a').forEach(link => {
        const href = link.getAttribute('href');
        if (href && href !== '#' && !href.startsWith('#')) {
          const linkPage = href.split('/').pop();
          if (linkPage === currentPath) {
            link.classList.add('text-primary', 'font-bold', 'active');
            if (link.classList.contains('dropdown-item')) {
              link.classList.add('bg-primary/10', 'dark:bg-primary/20');
            }
            const parentDrop = link.closest('.dropdown-studio');
            if (parentDrop) {
              const dropBtn = parentDrop.querySelector('button');
              if (dropBtn) dropBtn.classList.add('text-primary', 'font-bold', 'active');
            }
          }
        }
      });
    })();

    // 5. Password Visibility Toggle
    document.querySelectorAll('.toggle-password').forEach(btn => {
      btn.addEventListener('click', () => {
        const targetId = btn.getAttribute('data-target');
        const input = document.getElementById(targetId);
        if (input) {
          const type = input.getAttribute('type') === 'password' ? 'text' : 'password';
          input.setAttribute('type', type);
          const icon = btn.querySelector('i');
          if (icon) {
            icon.classList.toggle('fa-eye-slash');
            icon.classList.toggle('fa-eye');
          }
        }
      });
    });

    // 6. Social Login Placeholder
    window.socialLogin = function(provider) {
      alert('Social login with ' + provider + ' is not yet configured. Please use the email and password form.');
    };
  });
</script>
</body>
</html>

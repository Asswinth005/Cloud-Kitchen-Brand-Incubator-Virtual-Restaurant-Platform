    <!-- Tailwind CSS -->

    <script>

    <!-- Google Fonts: Playfair Display + Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <style>
        /* ----- NO SCROLL — fit exactly one screen ----- */
        html,
        body {
            height: 100%;
            overflow: hidden;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #FCF8F5;
            color: #1E1A17;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            padding: 0;
            font-family: 'Inter', system-ui, sans-serif;
        }

        .dark body {
            background-color: #1A1614;
            color: #EDE6E0;
        }

        /* Dark mode fallback text contrast overrides */
        .dark .text-\[\#1E1A17\] {
            color: #EDE6E0;
        }
        .dark input,
        .dark select,
        .dark textarea {
            color: #FFFFFF !important;
        }

        /* toggle buttons — positioned top-right */
        .theme-toggle-wrapper {
            position: fixed;
            top: 12px;
            right: 12px;
            z-index: 1000;
            display: flex;
            gap: 6px;
        }

        .toggle-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: rgba(217, 108, 58, 0.15);
            color: #D96C3A;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
            font-size: 1rem;
            font-weight: bold;
        }

        .dark .toggle-btn {
            background: rgba(217, 108, 58, 0.2);
            color: #E88A5E;
        }

        .toggle-btn:hover {
            transform: scale(1.1);
            background: #D96C3A;
            color: #FCF8F5;
        }

        .dark .toggle-btn:hover {
            background: #D96C3A;
            color: #FCF8F5;
        }

        /* SIGNUP CARD — CloudKitchen theme */
        .signup-card {
            background: white;
            border-radius: 36px;
            padding: 1.8rem 2rem;
            box-shadow: 0 20px 45px rgba(217, 108, 58, 0.12);
            border: 1px solid rgba(217, 108, 58, 0.15);
            width: 100%;
            max-width: 460px;
            margin: 0 auto;
            transition: background 0.2s ease;
        }

        .dark .signup-card {
            background: #2A2420;
            border-color: rgba(217, 108, 58, 0.3);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
        }

        /* input styling */
        .signup-input {
            width: 100%;
            padding: 0.8rem 1.2rem 0.8rem 3rem;
            border-radius: 50px;
            border: 1.5px solid rgba(217, 108, 58, 0.15);
            background: white;
            font-size: 0.9rem;
            transition: all 0.2s;
            color: #1E1A17;
            font-family: 'Inter', sans-serif;
        }

        .dark .signup-input {
            background: #1A1614;
            border-color: rgba(217, 108, 58, 0.3);
            color: #EDE6E0;
        }

        .signup-input:focus {
            outline: none;
            border-color: #D96C3A;
            box-shadow: 0 0 0 3px rgba(217, 108, 58, 0.2);
        }

        .dark .signup-input:focus {
            border-color: #E88A5E;
            box-shadow: 0 0 0 3px rgba(217, 108, 58, 0.25);
        }

        /* password wrapper for eye icon */
        .password-wrapper {
            position: relative;
            width: 100%;
        }

        .password-wrapper .signup-input {
            padding-right: 3rem;
        }

        .toggle-password {
            position: absolute;
            right: 1rem;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #D96C3A;
            font-size: 0.95rem;
            transition: color 0.2s;
            background: transparent;
            border: none;
            z-index: 5;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .dark .toggle-password {
            color: #E88A5E;
        }

        .toggle-password:hover {
            color: #BF5A2E;
        }

        [dir="rtl"] .toggle-password {
            right: auto;
            left: 1rem;
        }

        [dir="rtl"] .password-wrapper .signup-input {
            padding-right: 1.2rem;
            padding-left: 3rem;
        }

        [dir="rtl"] .input-icon {
            left: auto;
            right: 1.1rem;
        }

        /* primary button */
        .scoop-btn {

            color: #FCF8F5;

            padding: 0.8rem 1.5rem;

            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 100%;

            border: none;

            font-size: 0.85rem;
            display: inline-flex;

            margin-left: 0;

        /* hidden utility */

        /* container */

        /* center logo container */

            .theme-toggle-wrapper {
                top: 12px;
                right: 12px;
            }

            [dir="rtl"] .theme-toggle-wrapper {
                left: 12px;
            }
        }
    </style>
</head>

    <!-- ===== DARK / LIGHT + RTL TOGGLE SCRIPT + EYE ICON FUNCTIONALITY ===== -->

<script>
  document.addEventListener('DOMContentLoaded', () => {
    // 1. Theme Toggle
    const themeBtns = document.querySelectorAll('#theme-toggle, #mobile-theme-toggle');
    themeBtns.forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.preventDefault();
        document.documentElement.classList.toggle('dark');
        localStorage.setItem('theme', document.documentElement.classList.contains('dark') ? 'dark' : 'light');
      });
    });
    if (localStorage.getItem('theme') === 'dark') {
      document.documentElement.classList.add('dark');
    }

    // 2. RTL Toggle
    function setRTL(isRTL) {
      const html = document.documentElement;
      if (isRTL === 'rtl' || isRTL === true) {
        html.setAttribute('dir', 'rtl');
        localStorage.setItem('dir', 'rtl');
      } else {
        html.setAttribute('dir', 'ltr');
        localStorage.setItem('dir', 'ltr');
      }
    }
    if (localStorage.getItem('dir') === 'rtl') setRTL(true);

    const rtlBtn = document.getElementById('rtl-toggle');
    if (rtlBtn) {
      rtlBtn.addEventListener('click', (e) => {
        e.preventDefault();
        const currentDir = document.documentElement.getAttribute('dir');
        setRTL(currentDir === 'rtl' ? 'ltr' : 'rtl');
      });
    }

    const mobileRtlBtn = document.getElementById('mobile-rtl-toggle');
    if (mobileRtlBtn) {
      mobileRtlBtn.addEventListener('click', (e) => {
        e.preventDefault();
        const currentDir = document.documentElement.getAttribute('dir');
        setRTL(currentDir === 'rtl' ? 'ltr' : 'rtl');
      });
    }

    // 3. Mobile Menu Toggle
    const mobileToggle = document.getElementById('mobile-toggle');
    const mobileMenu = document.getElementById('mobile-menu');
    if (mobileToggle && mobileMenu) {
      mobileToggle.addEventListener('click', () => {
        mobileMenu.classList.toggle('open');
      });
    }

    // 4. Dynamic Active Link Highlighting
    (function highlightActiveLinks() {
      let currentPath = window.location.pathname.split('/').pop() || 'index.html';
      if (!currentPath || currentPath === '/') currentPath = 'index.html';

      document.querySelectorAll('.nav-link, .dropdown-item, .mobile-menu-studio a').forEach(link => {
        const href = link.getAttribute('href');
        if (href && href !== '#' && !href.startsWith('#')) {
          const linkPage = href.split('/').pop();
          if (linkPage === currentPath) {
            link.classList.add('text-primary', 'font-bold', 'active');
            if (link.classList.contains('dropdown-item')) {
              link.classList.add('bg-primary/10', 'dark:bg-primary/20');
            }
            const parentDrop = link.closest('.dropdown-studio');
            if (parentDrop) {
              const dropBtn = parentDrop.querySelector('button');
              if (dropBtn) dropBtn.classList.add('text-primary', 'font-bold', 'active');
            }
          }
        }
      });
    })();

    // 5. Password Visibility Toggle
    document.querySelectorAll('.toggle-password').forEach(btn => {
      btn.addEventListener('click', () => {
        const targetId = btn.getAttribute('data-target');
        const input = document.getElementById(targetId);
        if (input) {
          const type = input.getAttribute('type') === 'password' ? 'text' : 'password';
          input.setAttribute('type', type);
          const icon = btn.querySelector('i');
          if (icon) {
            icon.classList.toggle('fa-eye-slash');
            icon.classList.toggle('fa-eye');
          }
        }
      });
    });

    // 6. Social Signup Placeholder
    window.socialSignup = function(provider) {
      alert('Social signup with ' + provider + ' is not yet configured. Please use the email and password form.');
    };
    document.getElementById('googleSignupBtn')?.addEventListener('click', () => socialSignup('google'));
    document.getElementById('appleSignupBtn')?.addEventListener('click', () => socialSignup('apple'));
  });
</script>
</body>
</html>
